# Beispiel /etc/turnserver.conf für coturn (TURN-Server für Portriga-Voice).
# Installation (Debian 13):  apt-get install -y coturn
# Aktivieren:                sed -i 's/^#TURNSERVER_ENABLED/TURNSERVER_ENABLED/' /etc/default/coturn
#                           (bzw. TURNSERVER_ENABLED=1 setzen), dann: systemctl enable --now coturn

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech

# Long-term-Credentials – müssen mit TURN_USER/TURN_PASS des Node-Servers übereinstimmen:
user=portriga:CHANGE_ME
realm=deine-domain.de

# Nur hinter NAT nötig – öffentliche IP des Hosts:
# external-ip=DEINE_OEFFENTLICHE_IP

# TLS (empfohlen; dann im Server TURN_URL=turns:deine-domain.de:5349 verwenden):
# cert=/etc/letsencrypt/live/deine-domain.de/fullchain.pem
# pkey=/etc/letsencrypt/live/deine-domain.de/privkey.pem

# Medien-Relay-Portbereich (muss in Firewall/LXC offen sein, UDP):
min-port=49152
max-port=65535
no-cli

# WICHTIG – diese Ports am Host/Router/LXC freigeben:
#   3478/udp, 3478/tcp        (TURN/STUN)
#   5349/tcp                  (TURN über TLS, falls genutzt)
#   49152-65535/udp           (Medien-Relay)
